name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake zip

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" "ndk;$NDK_VERSION"

      - name: Cache third-party libraries
        uses: actions/cache@v4
        with:
          path: |
            third_party
            build/deps
          key: deps-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/fetch_deps.sh', 'scripts/build_deps.sh') }}

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/maniadrive.keystore
            echo "Using the release key from the repository secrets."
          else
            echo "No KEYSTORE_BASE64 secret: a temporary key is generated (see BUILD.md)."
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'maniadrive' }}
          KS_ALIAS: ${{ secrets.KS_ALIAS || 'maniadrive' }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          VERSION_CODE=${{ github.run_number }} ./build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ManiaDrive-apk
          path: build/ManiaDrive.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ManiaDrive.apk
